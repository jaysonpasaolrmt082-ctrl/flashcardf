<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SciMath Battle Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* One bright "quiz bee stage" look, same in light and dark. */
:root {
  color-scheme: light;
  --sun: #ffd23f;
  --sun-deep: #f4bd0b;
  --ink: #1b1d4d;
  --ink-soft: #4b4f86;
  --paper: #ffffff;
  --cloud: #f3f4ff;
  --blue: #2f5bff;
  --blue-soft: #e4eaff;
  --green: #12a863;
  --green-soft: #dcf7e9;
  --orange: #ff7a1a;
  --orange-soft: #ffeede;
  --red: #ef2f55;
  --red-soft: #ffe1e7;
  --purple: #7a4dff;
  --purple-soft: #ece5ff;
  --teal: #0b9aa8;
  --teal-soft: #d9f5f7;
  --mark: #fff06a;
  --gold: #ffb400;
  --edge: 3px solid var(--ink);
  --lift: 4px 4px 0 var(--ink);
  --display: "Fredoka", "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background-color: var(--sun);
  background-image: radial-gradient(var(--sun-deep) 1.6px, transparent 1.7px);
  background-size: 22px 22px;
  color: var(--ink);
  font: 700 17px/1.5 var(--body);
  padding-inline: 16px;
  padding-block: 18px 60px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }
.app { max-width: 880px; margin: 0 auto; display: grid; gap: 18px; }

/* Shared chunky "sticker" pieces */
.box { background: var(--paper); border: var(--edge); border-radius: 22px; box-shadow: var(--lift); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: var(--edge); border-radius: 16px; box-shadow: var(--lift);
  background: var(--paper); padding: 12px 20px; font: 600 19px/1.1 var(--display); letter-spacing: .01em;
  transition: transform .08s, box-shadow .08s;
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: default; transform: none; box-shadow: var(--lift); }
.btn.blue { background: var(--blue); color: #fff; }
.btn.green { background: var(--green); color: #fff; }
.btn.red { background: var(--red); color: #fff; }
.btn.orange { background: var(--orange); color: #fff; }
.btn.purple { background: var(--purple); color: #fff; }
.btn.ghost { background: var(--cloud); }
.btn.small { font-size: 15px; padding: 8px 12px; border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); }
mark, .hl {
  background: linear-gradient(transparent 12%, var(--mark) 12%, var(--mark) 88%, transparent 88%);
  color: var(--ink); font-weight: 900; padding: 0 3px; border-radius: 4px;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}

/* ---------- Top bar ---------- */
.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.logo { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; text-align: left; }
.logo-badge {
  width: 54px; height: 54px; border-radius: 16px; background: var(--blue); color: #fff;
  border: var(--edge); box-shadow: 3px 3px 0 var(--ink); display: grid; place-items: center;
  font: 700 22px/1 var(--display); transform: rotate(-6deg); flex: none;
}
.logo h1 { margin: 0; font: 700 clamp(26px, 5.4vw, 38px)/1 var(--display); letter-spacing: -.01em; }
.logo small { display: block; font: 800 12px/1.4 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.top-tools { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Home ---------- */
.hello { padding: 18px 20px; display: grid; gap: 12px; }
.hello-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; justify-content: space-between; }
.namebox { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.namebox label { font: 600 20px/1 var(--display); }
.namebox input {
  border: var(--edge); border-radius: 12px; padding: 8px 12px; width: 190px; max-width: 100%;
  font: 700 18px/1.2 var(--body); background: var(--cloud);
}
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { background: var(--cloud); border-radius: 14px; padding: 6px 14px; text-align: center; min-width: 92px; }
.stat b { display: block; font: 700 24px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
.bar { height: 16px; border: var(--edge); border-radius: 99px; background: var(--cloud); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); width: 0; transition: width .5s; border-right: 3px solid var(--ink); }
.bar i[style*="width: 0"] { border-right: 0; }

.battle {
  background: var(--ink); color: #fff; padding: 22px; display: grid; gap: 14px;
  grid-template-columns: minmax(0, 1fr) auto; align-items: center; position: relative; overflow: hidden;
}
.battle h2 { margin: 0; font: 700 clamp(26px, 5vw, 36px)/1.05 var(--display); color: var(--sun); }
.battle p { margin: 4px 0 0; color: #d9dcff; font-weight: 700; max-width: 46ch; }
.rounds-mini { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 3px 12px; font: 600 14px/1.5 var(--display); border: 2px solid var(--ink); }
.pill.easy { background: var(--green); color: #fff; }
.pill.average { background: var(--orange); color: #fff; }
.pill.difficult { background: var(--red); color: #fff; }
.pill.warm { background: var(--teal); color: #fff; }
.pill.memo { background: var(--purple); color: #fff; }
.pill.mix { background: var(--blue); color: #fff; }
.battle .btn { background: var(--sun); color: var(--ink); font-size: 22px; padding: 16px 22px; border-color: #fff; box-shadow: 4px 4px 0 #fff; }
@media (max-width: 560px) { .battle { grid-template-columns: 1fr; } .battle .btn { width: 100%; } }

.section-title { display: flex; justify-content: space-between; align-items: end; gap: 10px; flex-wrap: wrap; margin: 6px 2px -4px; }
.section-title h3 { margin: 0; font: 700 24px/1.1 var(--display); }
.section-title p { margin: 0; font-size: 14px; color: var(--ink-soft); }
.group { padding: 16px; display: grid; gap: 12px; }
.group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.group-head h4 { margin: 0; font: 700 20px/1.1 var(--display); }
.group-head span { font-size: 14px; color: var(--ink-soft); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.tile {
  text-align: left; border: var(--edge); border-radius: 16px; background: var(--c-soft); padding: 12px 14px;
  display: grid; gap: 8px; box-shadow: 3px 3px 0 var(--ink); transition: transform .08s;
}
.tile:hover { transform: translate(-1px, -2px) rotate(-.5deg); }
.tile .t-name { font: 600 18px/1.15 var(--display); }
.tile .t-meta { font-size: 13px; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 6px; }
.tile .stars { color: var(--gold); letter-spacing: 1px; font-size: 16px; -webkit-text-stroke: .6px var(--ink); }
.minibar { height: 8px; border-radius: 99px; background: rgba(27,29,77,.12); overflow: hidden; }
.minibar i { display: block; height: 100%; background: var(--c); }
[data-round="easy"] { --c: var(--green); --c-soft: var(--green-soft); }
[data-round="average"] { --c: var(--orange); --c-soft: var(--orange-soft); }
[data-round="difficult"] { --c: var(--red); --c-soft: var(--red-soft); }
[data-round="warm"] { --c: var(--teal); --c-soft: var(--teal-soft); }
[data-round="memo"] { --c: var(--purple); --c-soft: var(--purple-soft); }
[data-round="mix"] { --c: var(--blue); --c-soft: var(--blue-soft); }

.fame { padding: 16px 18px; display: grid; gap: 10px; }
.fame ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.fame li { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--cloud); }
.fame li.me { background: var(--mark); }
.fame .pos { font: 700 20px/1 var(--display); text-align: center; }
.fame .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fame .who small { display: block; font-size: 13px; color: var(--ink-soft); font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
.fame .pts { font: 700 18px/1 var(--display); font-variant-numeric: tabular-nums; text-align: right; }
.empty { color: var(--ink-soft); margin: 0; }

.rules { padding: 16px 18px; }
.rules summary { font: 600 20px/1.2 var(--display); cursor: pointer; }
.rules ul { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 4px; font-size: 15px; }

/* ---------- Mode picker ---------- */
.picker { padding: 22px; display: grid; gap: 16px; }
.picker h2 { margin: 0; font: 700 30px/1.1 var(--display); }
.picker .sub { margin: 0; color: var(--ink-soft); }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.mode { text-align: left; border: var(--edge); border-radius: 18px; padding: 16px; display: grid; gap: 6px; box-shadow: var(--lift); background: var(--paper); transition: transform .08s; }
.mode:hover { transform: translate(-1px, -2px); }
.mode .ic { font-size: 30px; line-height: 1; }
.mode b { font: 700 22px/1.1 var(--display); }
.mode span { font-size: 15px; color: var(--ink-soft); }
.mode.m-contest { background: var(--blue-soft); }
.mode.m-master { background: var(--green-soft); }
.mode.m-learn { background: var(--purple-soft); }

/* ---------- Play ---------- */
.hud { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.hud .quit { width: 46px; height: 46px; padding: 0; font-size: 22px; }
.hud-mid { display: grid; gap: 6px; min-width: 0; }
.hud-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 15px; }
.hud-line .count { font-variant-numeric: tabular-nums; }
.scorebox { background: var(--ink); color: var(--sun); border: var(--edge); border-radius: 16px; padding: 6px 14px; text-align: center; min-width: 88px; box-shadow: 3px 3px 0 var(--paper); }
.scorebox b { display: block; font: 700 28px/1 var(--display); font-variant-numeric: tabular-nums; }
.scorebox span { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #fff; }
.scorebox.bump b { animation: bump .5s; }
@keyframes bump { 40% { transform: scale(1.35); } }
.streak { font: 600 16px/1 var(--display); color: var(--red); white-space: nowrap; }
.timer { height: 14px; border: var(--edge); border-radius: 99px; background: var(--paper); overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: var(--green); transform-origin: left; }
.timer.low i { background: var(--red); }
.timer-num { font: 700 18px/1 var(--display); font-variant-numeric: tabular-nums; min-width: 38px; text-align: right; }
.timer-num.low { color: var(--red); animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.2); } }

.qcard { padding: clamp(18px, 4vw, 30px); display: grid; gap: 16px; border-top-width: 10px; border-top-color: var(--c); }
.q-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.q-cat { font: 600 15px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
.q-pts { font: 600 15px/1 var(--display); background: var(--c); color: #fff; border-radius: 99px; padding: 5px 12px; border: 2px solid var(--ink); }
.q-text { margin: 0; font: 800 clamp(21px, 3.6vw, 27px)/1.4 var(--body); text-wrap: pretty; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .choices { grid-template-columns: 1fr; } }
.choice {
  display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left;
  border: var(--edge); border-radius: 16px; padding: 10px 14px 10px 10px; background: var(--paper); box-shadow: 3px 3px 0 var(--ink);
  font: 800 17px/1.35 var(--body); transition: transform .08s, background .15s;
}
.choice:hover:not(:disabled) { transform: translate(-1px, -2px); }
.choice .letter { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font: 700 22px/1 var(--display); color: #fff; border: 2px solid var(--ink); }
.choice:nth-child(1) .letter { background: var(--blue); }
.choice:nth-child(2) .letter { background: var(--orange); }
.choice:nth-child(3) .letter { background: var(--green); }
.choice:nth-child(4) .letter { background: var(--purple); }
.choice:disabled { cursor: default; opacity: .55; }
.choice.right, .choice[data-right] { background: var(--green-soft); opacity: 1; border-color: var(--green); box-shadow: 3px 3px 0 var(--green); }
.choice.right .letter, .choice[data-right] .letter { background: var(--green); }
.choice.wrong { background: var(--red-soft); opacity: 1; border-color: var(--red); box-shadow: 3px 3px 0 var(--red); animation: shake .4s; }
.choice.wrong .letter { background: var(--red); }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

.typebox { display: grid; gap: 10px; }
.typebox label { font: 600 17px/1 var(--display); color: var(--ink-soft); }
.typerow { display: flex; gap: 10px; flex-wrap: wrap; }
.typerow input {
  flex: 1 1 220px; min-width: 0; border: var(--edge); border-radius: 16px; padding: 12px 16px;
  font: 700 24px/1.2 var(--display); background: var(--cloud); box-shadow: inset 0 3px 0 rgba(27,29,77,.08);
}
.typerow input:focus { background: #fff; outline: none; border-color: var(--blue); }
.typerow input.wrong { border-color: var(--red); background: var(--red-soft); animation: shake .4s; }
.typerow input.right { border-color: var(--green); background: var(--green-soft); }
.helpers { display: flex; gap: 8px; flex-wrap: wrap; }

.feedback { border: var(--edge); border-radius: 20px; padding: 16px 18px; display: grid; gap: 10px; animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { from { transform: scale(.92); opacity: 0; } }
.feedback.ok { background: var(--green-soft); border-color: var(--green); }
.feedback.no { background: var(--red-soft); border-color: var(--red); }
.feedback.info { background: var(--purple-soft); border-color: var(--purple); }
.fb-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.fb-title { font: 700 28px/1 var(--display); }
.feedback.ok .fb-title { color: var(--green); }
.feedback.no .fb-title { color: var(--red); }
.feedback.info .fb-title { color: var(--purple); }
.fb-plus { font: 700 20px/1 var(--display); background: var(--green); color: #fff; border-radius: 99px; padding: 5px 12px; border: 2px solid var(--ink); }
.fb-answer { font: 700 clamp(24px, 4.6vw, 34px)/1.15 var(--display); color: var(--ink); overflow-wrap: anywhere; }
.fb-answer small { display: block; font: 800 13px/1.4 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.fb-yours { font-size: 15px; color: var(--ink-soft); }
.fb-yours s { color: var(--red); }
.fb-how { margin: 0; font-size: 17px; font-weight: 700; }
.fb-trick { margin: 0; background: var(--paper); border: 2px dashed var(--ink); border-radius: 14px; padding: 10px 12px; font-size: 16px; }
.fb-trick b { color: var(--purple); font-family: var(--display); font-weight: 600; font-size: 18px; }
.fb-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.linkish { background: none; border: 0; padding: 4px 0; font-size: 14px; color: var(--ink-soft); text-decoration: underline; }

/* ---------- Interstitial & results ---------- */
.splash { padding: 34px 24px; text-align: center; display: grid; gap: 12px; justify-items: center; background: var(--c-soft); }
.splash .big { font: 700 clamp(38px, 9vw, 64px)/1 var(--display); color: var(--c); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); }
.splash p { margin: 0; font-size: 18px; max-width: 40ch; }
.results { padding: 26px 22px; display: grid; gap: 16px; justify-items: center; text-align: center; }
.medal { font-size: 76px; line-height: 1; animation: pop .6s cubic-bezier(.2,1.6,.4,1); }
.rank-title { font: 700 clamp(32px, 7vw, 48px)/1 var(--display); margin: 0; }
.rank-msg { margin: 0; font-size: 18px; max-width: 44ch; }
.score-big { font: 700 64px/1 var(--display); font-variant-numeric: tabular-nums; }
.score-big small { font-size: 26px; color: var(--ink-soft); }
.res-stats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.res-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.review { width: 100%; text-align: left; display: grid; gap: 8px; }
.review h4 { margin: 0; font: 700 22px/1.1 var(--display); }
.review-item { background: var(--red-soft); border-radius: 14px; padding: 10px 14px; border: 2px solid var(--red); }
.review-item .rq { font-size: 15px; }
.review-item .ra { font: 700 19px/1.25 var(--display); color: var(--green); }
.fame-note { font: 600 18px/1.3 var(--display); background: var(--mark); padding: 6px 14px; border-radius: 99px; border: 2px solid var(--ink); }

.reset-box { padding: 16px 18px; display: grid; gap: 12px; }
.reset-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.reset-opt { border: 2px dashed var(--ink); border-radius: 16px; padding: 12px 14px; display: grid; gap: 8px; align-content: start; background: var(--cloud); }
.reset-opt b { font: 600 19px/1.2 var(--display); }
.reset-opt span { font-size: 14px; color: var(--ink-soft); }
.reset-opt.ask { background: var(--red-soft); border-color: var(--red); border-style: solid; }
.reset-opt .row { display: flex; gap: 8px; flex-wrap: wrap; }
.toast { background: var(--green); color: #fff; border: var(--edge); border-radius: 16px; box-shadow: var(--lift); padding: 12px 16px; font: 600 19px/1.3 var(--display); animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="app">
  <header class="topbar">
    <button class="logo" data-go="home" aria-label="Go to home">
      <span class="logo-badge">S+M</span>
      <span><small>DOST Caraga · Grade 6</small><h1>SciMath Battle Arena</h1></span>
    </button>
    <div class="top-tools">
      <button class="btn small ghost" id="soundBtn" aria-pressed="true">🔊 Sound on</button>
      <button class="btn small ghost" id="timerBtn">⏱ Timer: on</button>
      <button class="btn small ghost" data-go="reset">↺ Start over</button>
    </div>
  </header>
  <main id="screen" aria-live="polite"></main>
</div>

<script src="cards.js"></script>
<script src="sci.js"></script>
<script src="gen.js"></script>
<script src="keys.js"></script>
<script src="check.js"></script>
<script>
(function () {
  "use strict";
  var GROUPS = window.GROUPS, DECKS = window.DECKS, CARDS = window.CARDS, KEYS = window.KEYS || {};
  var STORE = "scimath-arena-v2";
  var screen = document.getElementById("screen");

  // ---------- Data ----------
  var ALL = [], BY_ID = {}, BY_DECK = {};
  DECKS.forEach(function (d) {
    BY_DECK[d.id] = [];
    (CARDS[d.id] || []).forEach(function (c, i) {
      var id = d.id + ":" + i;
      var card = Object.assign({}, c, KEYS[id] || {});
      var item = { id: id, deck: d, card: card };
      ALL.push(item); BY_ID[id] = item; BY_DECK[d.id].push(item);
    });
  });
  function deckById(id) { return DECKS.filter(function (d) { return d.id === id; })[0]; }
  function groupOf(d) { return GROUPS.filter(function (g) { return g.id === d.group; })[0]; }

  // ---------- Saved progress (this device only) ----------
  var save = (function () { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } })();
  save.stars = save.stars || {};      // card id -> 0..3 stars
  save.missed = save.missed || {};    // card id -> 1 if last try was wrong
  save.fame = save.fame || [];        // hall of fame
  save.seen = save.seen || {};        // card id -> last time it was asked
  save.name = save.name || "";
  save.timer = save.timer || "on";    // on | relaxed | off
  if (save.sound === undefined) save.sound = true;
  function persist() { try { localStorage.setItem(STORE, JSON.stringify(save)); } catch (e) {} }

  function stars(id) { return save.stars[id] || 0; }
  function mastered(list) { return list.filter(function (x) { return stars(x.id) >= 3; }).length; }
  function starSum(list) { return list.reduce(function (s, x) { return s + stars(x.id); }, 0); }

  // ---------- Helpers ----------

  function choicesHTML(list, helped) {
    return '<div class="choices" role="group" aria-label="Answer choices">' + list.map(function (t, i) {
      return '<button class="choice" data-choice="' + i + '"' + (helped ? ' data-helped="1"' : '') + '><span class="letter">' + "ABCD"[i] + '</span><span>' + esc(t) + '</span></button>';
    }).join("") + '</div>';
  }

  // How a question is shown this time. In contests, choices are shuffled, some typed
  // questions become tricky multiple choice, and some multiple choice must be typed.
  function viewFor(it) {
    var c = it.card, contest = S.mode === "contest" || S.mode === "full";
    if (S.mode === "learn" || c.self) return {};
    if (c.c) {
      var rightAt = "ABCD".indexOf(c.a.charAt(0));
      if (c.c.length === 2) return { choices: c.c, right: rightAt };
      if (contest && Math.random() < 0.3 && Traps.strip(c.a).length <= 22) return { converted: true };
      var order = shuffle(c.c.map(function (_, i) { return i; }));
      return { choices: order.map(function (i) { return c.c[i]; }), right: order.indexOf(rightAt) };
    }
    if (contest && Traps.canChoose(c) && Math.random() < 0.35) return Traps.make(c, poolFor(it));
    return {};
  }
  function poolFor(it) {
    return ALL.filter(function (x) { return x.deck.group === it.deck.group && x.id !== it.id && !x.card.c && !x.card.self && !x.card.gen; })
      .map(function (x) { return x.card.a; });
  }

  // ---------- Answering ----------
  function submitTyped() {
    if (S.answered) return;
    var inp = document.getElementById("typed");
    var val = inp ? inp.value : "";
    if (!val.trim()) { inp.focus(); inp.placeholder = "Type something first!"; return; }
    var it = S.queue[S.pos];
    var ok = Check.check(it.card, val);
    if (inp) { inp.classList.add(ok ? "right" : "wrong"); inp.disabled = true; }
    finish(ok, { given: val });
  }
  function pickChoice(btn) {
    if (S.answered) return;
    var it = S.queue[S.pos], i = +btn.getAttribute("data-choice");
    var helped = btn.hasAttribute("data-helped");
    var rightIdx = it.view.right;
    var ok = i === rightIdx;
    var btns = document.querySelectorAll(".choice");
    btns.forEach(function (b, j) { b.disabled = true; if (j === rightIdx) b.classList.add("right"); });
    if (!ok) btn.classList.add("wrong");
    finish(ok, { given: btn.textContent.slice(1), helped: helped, mc: true });
  }

  function finish(ok, info) {
    stopTimer();
    S.answered = true;
    var it = S.queue[S.pos];
    var firstTime = !S.done[it.key] && !S.uniq[it.key];
    save.seen[it.id] = Date.now();
    S.uniq[it.key] = true;
    var gain = 0;
    var undo = { starsBefore: stars(it.id), missedBefore: !!save.missed[it.id], streakBefore: S.streak, inserted: -1, gain: 0, firstTime: firstTime };

    if (firstTime) { S.max += it.pts; S.firstTries++; }
    if (ok) {
      if (firstTime) { gain = info.helped ? it.pts / 2 : it.pts; S.score += gain; S.right++; }
      S.done[it.key] = true;
      S.streak++; S.best = Math.max(S.best, S.streak);
      save.stars[it.id] = Math.min(3, stars(it.id) + (info.helped ? 0 : 1));
      delete save.missed[it.id];
    } else {
      S.streak = 0;
      save.stars[it.id] = Math.max(0, stars(it.id) - 1);
      save.missed[it.id] = 1;
      if (firstTime) S.wrongList.push(it);
      if (S.mode === "master") {
        var at = Math.min(S.queue.length, S.pos + 3);
        S.queue.splice(at, 0, Object.assign({}, it));
        undo.inserted = at;
      }
    }
    undo.gain = gain;
    S.lastUndo = undo;
    persist();

    document.querySelectorAll("#answerZone .helpers, #answerZone [data-act=submit]").forEach(function (el) { el.hidden = true; });
    if (ok) { sfx.right(); confetti(S.streak >= 3 ? 70 : 36); bumpScore(); }
    else sfx.wrong();
    showFeedback(ok, info);
  }

  function bumpScore() {
    var sb = document.getElementById("scorebox");
    if (!sb) return;
    sb.querySelector("b").textContent = fmtPts(S.score);
    sb.classList.remove("bump"); void sb.offsetWidth; sb.classList.add("bump");
  }

  // "My answer was right": the checker can't know every way to write an answer.
  function overrule() {
    var u = S.lastUndo, it = S.queue[S.pos];
    if (!u || u.overruled) return;
    u.overruled = true;
    save.stars[it.id] = Math.min(3, u.starsBefore + 1);
    delete save.missed[it.id];
    if (u.firstTime) { S.score += it.pts; S.right++; S.wrongList = S.wrongList.filter(function (x) { return x.key !== it.key; }); }
    if (u.inserted >= 0) S.queue.splice(u.inserted, 1);
    S.done[it.key] = true;
    S.streak = u.streakBefore + 1; S.best = Math.max(S.best, S.streak);
    persist(); sfx.right(); confetti(30); bumpScore();
    var inp = document.getElementById("typed"); if (inp) { inp.classList.remove("wrong"); inp.classList.add("right"); }
    showFeedback(true, { overruled: true });
  }

  function showFeedback(ok, info) {
    var it = S.queue[S.pos], c = it.card;
    var words = (c.h || []).slice();
    var ans = cleanAns(c.a);
    var how = c.e ? '<p class="fb-how">' + hl(c.e, words) + '</p>' : '';
    var trick = c.m ? '<p class="fb-trick"><b>Remember:</b> ' + hl(c.m, words) + '</p>' : '';
    var last = S.pos === S.queue.length - 1;
    var nextLabel = last ? "See my score ▶" : "Next ▶";
    var cls, title, extra = "";

    if (info.info) { cls = "info"; title = "The answer"; }
    else if (ok) {
      cls = "ok";
      title = pickOne(["Correct!", "Great job!", "You got it!", "Awesome!", "Brilliant!"]);
      if (info.overruled) title = "Counted as correct";
      if (info.helped) extra = '<span class="fb-plus">+' + fmtPts(it.pts / 2) + '</span>';
      else if (S.lastUndo && S.lastUndo.firstTime && S.mode !== "learn") extra = '<span class="fb-plus">+' + it.pts + '</span>';
      if (S.lastUndo && S.lastUndo.firstTime === false && !info.overruled) extra = '<span class="fb-plus">Fixed!</span>';
    } else {
      cls = "no";
      title = info.timeout ? "Time's up!" : info.skip ? "Here's the answer" : "Not quite!";
    }

    var yours = (!ok && info.given && !info.mc) ? '<div class="fb-yours">You wrote: <s>' + esc(info.given) + '</s></div>' : '';
    var canOverrule = !ok && !info.mc && !info.timeout && !info.skip && !info.info && info.given;
    var master = S.mode === "master" && !ok && !info.info ? '<div style="font-size:15px">🔁 This one will come back in a few questions.</div>' : '';

    document.getElementById("fb").innerHTML =
      '<div class="feedback ' + cls + '">' +
        '<div class="fb-head"><span class="fb-title">' + title + '</span>' + extra + '</div>' +
        '<div class="fb-answer"><small>Correct answer</small>' + hl(ans, words) + '</div>' + yours + how + trick + master +
        '<div class="fb-actions">' +
          (canOverrule ? '<button class="linkish" data-act="overrule">My answer means the same thing. Count it!</button>' : '<span></span>') +
          (info.selfCheck
            ? '<span style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn red" data-act="selfno">I missed it ✗</button><button class="btn green" data-act="selfyes">I got it ✓</button></span>'
            : '<button class="btn blue" data-act="next" id="nextBtn">' + nextLabel + '</button>') +
        '</div>' +
      '</div>';
    var nb = document.getElementById("nextBtn"); if (nb) nb.focus({ preventScroll: true });
    var fb = document.getElementById("fb");
    if (fb.getBoundingClientRect().top > innerHeight * 0.6) fb.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
  }
  function pickOne(a) { return a[Math.floor(Math.random() * a.length)]; }

  function reveal() {
    var it = S.queue[S.pos];
    if (S.mode === "learn") { S.answered = true; showFeedback(false, { info: true }); return; }
    stopTimer();
    document.getElementById("answerZone").innerHTML = "";
    showFeedback(false, { info: true, selfCheck: true });
  }

  function next() {
    S.pos++;
    ask();
  }

  // ---------- Timer ----------
  var tick = null;
  function startTimer(secs) {
    var bar = document.getElementById("tbar"), num = document.getElementById("tnum");
    var end = Date.now() + secs * 1000, lastSec = -1;
    function step() {
      var left = Math.max(0, end - Date.now()), s = Math.ceil(left / 1000);
      if (bar) { bar.firstChild.style.transform = "scaleX(" + left / (secs * 1000) + ")"; bar.classList.toggle("low", s <= 5); }
      if (num) { num.textContent = s + "s"; num.classList.toggle("low", s <= 5); }
      if (s !== lastSec && s <= 3 && s > 0) sfx.tick();
      lastSec = s;
      if (left <= 0) {
        stopTimer();
        if (S && !S.answered) {
          var inp = document.getElementById("typed"); if (inp) inp.disabled = true;
          var it = S.queue[S.pos];
          if (it.card.self) { reveal(); return; }
          document.querySelectorAll(".choice").forEach(function (b, j) {
            b.disabled = true;
            var rightIdx = it.view.right;
            if (j === rightIdx) b.classList.add("right");
          });
          finish(false, { timeout: true });
        }
      }
    }
    step(); tick = setInterval(step, 100);
  }
  function stopTimer() { if (tick) { clearInterval(tick); tick = null; } }

  // ---------- Round splash ----------
  function splash(r) {
    stopTimer();
    screen.innerHTML = '<section class="box splash" data-round="' + r.round + '">' +
      '<span class="pill ' + r.round + '">Round ' + (S.rounds.indexOf(r) + 1) + ' of 3</span>' +
      '<div class="big">' + r.name + '</div>' +
      '<p><b>' + r.items.length + ' questions</b> · <b>' + r.pts + ' point' + (r.pts > 1 ? "s" : "") + '</b> each · <b>' + (r.time >= 60 ? "1 minute" : r.time + " seconds") + '</b> per question' + (save.timer === "off" ? " (timer off)" : "") + '</p>' +
      (S.pos > 0 ? '<p>Score so far: <b>' + fmtPts(S.score) + '</b> of ' + S.max + '</p>' : '<p>Read carefully. Watch for <mark>“not”</mark> and <mark>“except”</mark>!</p>') +
      '<button class="btn blue" data-act="go" id="goBtn" style="font-size:24px;padding:16px 30px">Go! ▶</button></section>';
    document.getElementById("goBtn").focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  // ---------- Results ----------
  function results() {
    stopTimer();
    if (S.mode === "learn") {
      screen.innerHTML = '<section class="box results"><div class="medal">📖</div><h2 class="rank-title">All done!</h2>' +
        '<p class="rank-msg">You went through all ' + S.queue.length + ' cards. Now test yourself with a contest round or Master it.</p>' +
        '<div class="res-actions"><button class="btn blue" data-mode="contest" data-deck="' + S.deckId + '">🏆 Contest round</button>' +
        '<button class="btn green" data-mode="master" data-deck="' + S.deckId + '">🔁 Master it</button><button class="btn ghost" data-go="home">Home</button></div></section>';
      return;
    }
    var pct = S.max ? Math.round(S.score / S.max * 100) : 0;
    var r = rankFor(pct);
    var fameAt = null, place = 0;
    if (S.mode !== "master") {
      fameAt = Date.now();
      var d = new Date();
      save.fame.push({ at: fameAt, name: save.name || "Player", deck: S.title, pts: S.score, max: S.max, pct: pct, date: d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) });
      save.fame.sort(function (a, b) { return b.pct - a.pct || b.pts - a.pts || a.at - b.at; });
      save.fame = save.fame.slice(0, 30);
      place = save.fame.findIndex(function (f) { return f.at === fameAt; }) + 1;
      persist();
    }
    if (pct >= 60) { sfx.win(); confetti(pct >= 90 ? 220 : 120); }

    var html = '<section class="box results">';
    if (S.mode === "master") {
      html += '<div class="medal">🔁</div><h2 class="rank-title" style="color:var(--green)">All mastered!</h2>' +
        '<p class="rank-msg">You answered every card correctly. You got <b>' + S.right + ' of ' + S.firstTries + '</b> right on the first try. Play again tomorrow to earn more stars!</p>';
    } else {
      html += '<div class="medal">' + r.medal + '</div><h2 class="rank-title" style="color:' + r.color + ';-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill">' + r.title + '</h2>' +
        '<div class="score-big">' + fmtPts(S.score) + '<small> / ' + S.max + ' pts</small></div>' +
        '<p class="rank-msg">' + (save.name ? "<b>" + esc(save.name) + "!</b> " : "") + r.msg + '</p>' +
        (place ? '<div class="fame-note">#' + place + ' in the Hall of Fame</div>' : '');
    }
    html += '<div class="res-stats"><div class="stat"><b>' + S.right + '/' + S.firstTries + '</b><span>First try</span></div>' +
      '<div class="stat"><b>' + pct + '%</b><span>Score</span></div>' +
      '<div class="stat"><b>🔥 ' + S.best + '</b><span>Best streak</span></div></div>';

    var again = S.mode === "full" ? 'data-full="' + (S.kind || "") + '"' : 'data-mode="' + S.mode + '" data-deck="' + (S.deckId || "") + '"';
    html += '<div class="res-actions">' +
      (S.wrongList.length ? '<button class="btn red" data-act="fixthese">🔁 Practice my ' + plural(S.wrongList.length, "mistake") + '</button>' : '') +
      (S.deckId || S.mode === "full" ? '<button class="btn blue" ' + again + '>Play again</button>' : '') +
      '<button class="btn ghost" data-go="home">Home</button></div>';

    if (S.wrongList.length && S.mode !== "master") {
      html += '<div class="review"><h4>Remember these</h4>' + S.wrongList.map(function (it) {
        return '<div class="review-item"><div class="rq">' + hl(it.card.q, it.card.h) + '</div><div class="ra">✓ ' + esc(cleanAns(it.card.a)) + '</div></div>';
      }).join("") + '</div>';
    }
    html += '</section>';
    if (S.mode !== "master") html += fameHTML(fameAt);
    screen.innerHTML = html;
    window.scrollTo(0, 0);
  }

  // ---------- Events ----------
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button, [data-go]");
    if (!t) return;
    ensureAudio();
    if (t.hasAttribute("data-go")) { asking = null; return home(t.getAttribute("data-go") === "reset"); }
    if (t.hasAttribute("data-reset")) { asking = t.getAttribute("data-reset"); document.getElementById("resetBox").outerHTML = resetHTML(); var y = document.querySelector("[data-reset-yes]"); if (y) y.focus(); return; }
    if (t.hasAttribute("data-reset-no")) { asking = null; document.getElementById("resetBox").outerHTML = resetHTML(); return; }
    if (t.hasAttribute("data-reset-yes")) return doReset(t.getAttribute("data-reset-yes"));
    if (t.hasAttribute("data-full")) return startFull(t.getAttribute("data-full"));
    if (t.hasAttribute("data-fix")) return startFix();
    if (t.hasAttribute("data-mode")) return startDeck(t.getAttribute("data-deck"), t.getAttribute("data-mode"));
    if (t.classList.contains("tile")) return picker(t.getAttribute("data-deck"));
    if (t.hasAttribute("data-choice")) return pickChoice(t);
    var act = t.getAttribute("data-act");
    if (!act || !S) return;
    if (act === "submit") submitTyped();
    else if (act === "next") next();
    else if (act === "go") ask();
    else if (act === "reveal") reveal();
    else if (act === "overrule") overrule();
    else if (act === "selfyes") finish(true, { mc: true, selfDone: true });
    else if (act === "selfno") finish(false, { mc: true, selfDone: true });
    else if (act === "skip") { if (!S.answered) { var inp = document.getElementById("typed"); if (inp) inp.disabled = true; finish(false, { skip: true }); } }
    else if (act === "help") {
      if (S.answered) return;
      var it = S.queue[S.pos];
      it.view = Traps.make(it.card, poolFor(it));
      document.getElementById("answerZone").innerHTML = choicesHTML(it.view.choices, true) +
        '<p style="margin:0;font-size:14px;color:var(--ink-soft)">Choices on: this question is worth half points and doesn\'t earn a star.</p>';
    }
    else if (act === "fixthese") {
      var list = S.wrongList.map(function (x) { return makeItem(BY_ID[x.id], null, "master"); });
      S = newSession("master", "Fix my mistakes", shuffle(list));
      ask();
    }
  });

  // Keyboard: A-D or 1-4 pick a choice, Enter goes on.
  document.addEventListener("keydown", function (e) {
    if (!S || e.target.tagName === "INPUT") return;
    var k = e.key.toLowerCase();
    if (!S.answered) {
      var idx = "abcd".indexOf(k); if (idx < 0) idx = "1234".indexOf(k);
      var btns = document.querySelectorAll(".choice");
      if (idx >= 0 && btns[idx]) { e.preventDefault(); pickChoice(btns[idx]); }
    }
  });

  window.__arena = function () { return S; }; // read-only peek used by automated tests
  paintTop();
  home();
})();
</script>
</body>
</html>
